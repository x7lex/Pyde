[package]
name = "pyde-core"
version = "0.1.0"
edition = "2024"

[dependencies]
leptos = { version = "0.8.22", features = ["csr"] }
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["ErrorEvent", "HtmlTextAreaElement", "KeyboardEvent", "MessageEvent", "Window", "Worker", "WorkerOptions", "WorkerType"] }
