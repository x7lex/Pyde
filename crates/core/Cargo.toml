[package]
name = "pyde-core"
version = "0.1.0"
edition = "2024"

[dependencies]
leptos = { version = "0.8.22", features = ["csr"] }
monaco = { version = "0.7", default-features = false, features = ["api"] }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "DomRect",
    "Element",
    "HtmlElement",
    "PointerEvent",
    "Storage",
    "Window",
] }
